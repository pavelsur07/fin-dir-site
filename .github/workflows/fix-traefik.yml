name: Fix Traefik Docker API compatibility

# Одноразовый инструмент. Traefik v3.1 жёстко использует Docker API 1.24,
# Docker Engine 29 поднял минимум до 1.44 -> провайдер docker не видит ни одного
# контейнера -> Traefik отдаёт 404 на любой хост. Починка в v3.6.1+.
# Запускать вручную: gh workflow run fix-traefik.yml
# После успешного запуска этот файл можно удалить.

on:
    workflow_dispatch:

jobs:
    fix-traefik:
        runs-on: ubuntu-latest

        steps:
            - name: Upgrade Traefik over SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  script: |
                      set -euo pipefail

                      TARGET_IMAGE="traefik:v3.6.17"

                      if docker compose version >/dev/null 2>&1; then
                          COMPOSE_CMD=(docker compose)
                      elif command -v docker-compose >/dev/null 2>&1; then
                          COMPOSE_CMD=(docker-compose)
                      else
                          echo "Docker Compose is not available on the deploy host"
                          exit 1
                      fi

                      TRAEFIK_IMAGE="$(docker inspect traefik --format '{{.Config.Image}}')"
                      echo "==> current Traefik image: ${TRAEFIK_IMAGE}"

                      if [ "$TRAEFIK_IMAGE" = "$TARGET_IMAGE" ]; then
                          echo "already on ${TARGET_IMAGE}, nothing to do"
                      else
                          WORKDIR="$(docker inspect traefik --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"
                          FILE="$(docker inspect traefik --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}')"
                          SERVICE="$(docker inspect traefik --format '{{ index .Config.Labels "com.docker.compose.service" }}')"
                          PROJECT="$(docker inspect traefik --format '{{ index .Config.Labels "com.docker.compose.project" }}')"

                          : "${WORKDIR:?traefik is not compose-managed, upgrade it by hand}"
                          : "${FILE:?traefik has no compose config_files label, upgrade it by hand}"
                          : "${PROJECT:?traefik has no compose project label, upgrade it by hand}"

                          # config_files может быть относительным путём и списком через запятую.
                          # Резолвим его в рабочей директории Traefik -- именно этого не хватало
                          # прежнему шагу в deploy-vashfindir.yml, который патчил чужой файл.
                          FILE="${FILE%%,*}"
                          cd "$WORKDIR"
                          echo "==> traefik compose: ${WORKDIR}/${FILE}, project: ${PROJECT}, service: ${SERVICE}"
                          test -f "$FILE"

                          # /opt/traefik принадлежит root, а деплой-пользователь туда не пишет.
                          # Правим копию, а относительные пути (bind mounts, .env) резолвим
                          # через --project-directory в оригинальной директории Traefik.
                          PATCHED="$(mktemp /tmp/traefik-compose.XXXXXX.yml)"
                          sed "s#${TRAEFIK_IMAGE}#${TARGET_IMAGE}#g" "$FILE" > "$PATCHED"
                          grep -q "$TARGET_IMAGE" "$PATCHED"

                          COMPOSE_ARGS=(-p "$PROJECT" --project-directory "$WORKDIR" -f "$PATCHED")
                          "${COMPOSE_CMD[@]}" "${COMPOSE_ARGS[@]}" pull "$SERVICE"

                          # docker-compose 1.29.2 падает с KeyError: 'ContainerConfig' при
                          # пересоздании контейнера -- современные образы больше не отдают это
                          # поле в image inspect. На создании с нуля этот код не вызывается,
                          # поэтому сносим контейнер и поднимаем заново: ровно тот же приём,
                          # которым рабочий деплой приложения обновляет site/site-php-fpm.
                          "${COMPOSE_CMD[@]}" "${COMPOSE_ARGS[@]}" stop "$SERVICE" || true
                          "${COMPOSE_CMD[@]}" "${COMPOSE_ARGS[@]}" rm -f "$SERVICE" || true
                          "${COMPOSE_CMD[@]}" "${COMPOSE_ARGS[@]}" up -d "$SERVICE"

                          # Закрепить правку на диске, иначе следующий `up` в /opt/traefik
                          # откатит Traefik обратно на старый тег.
                          if [ -w "$FILE" ]; then
                              cp "$FILE" "$FILE.bak-pre-v3.6.17" && cp "$PATCHED" "$FILE"
                              echo "==> ${WORKDIR}/${FILE} updated in place"
                          elif sudo -n true 2>/dev/null; then
                              sudo cp "$FILE" "$FILE.bak-pre-v3.6.17" && sudo cp "$PATCHED" "$FILE"
                              echo "==> ${WORKDIR}/${FILE} updated in place (sudo)"
                          else
                              echo "WARNING: no write access to ${WORKDIR}/${FILE}; it still pins ${TRAEFIK_IMAGE}."
                              echo "WARNING: container is upgraded, but update that file by hand or a future"
                              echo "WARNING: 'docker-compose up' in ${WORKDIR} will downgrade Traefik again."
                          fi
                          rm -f "$PATCHED"
                      fi

                      echo "==> убрать мусор от сломанных запусков прежнего шага"
                      rm -f "${{ secrets.DEPLOY_PATH }}/docker-compose.yml.bak-pre-v3.6.17"

                      echo "==> wait for Traefik to rediscover containers"
                      sleep 15

                      echo "==> running image"
                      docker inspect traefik --format '{{.Config.Image}}'

                      echo "==> stale-API errors in the last 100 log lines (expect 0)"
                      docker logs --tail=100 traefik 2>&1 | grep -c "is too old" || true

                      echo "==> public HTTP check"
                      curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 --head https://vashfindir.ru/
