name: Fix Traefik Docker API compatibility

# Одноразовый инструмент. Traefik v3.1 жёстко использует Docker API 1.24,
# Docker Engine 29 поднял минимум до 1.44 -> провайдер docker не видит ни одного
# контейнера -> Traefik отдаёт 404 на любой хост. Починка в v3.6.1+.
# Запускать вручную: gh workflow run fix-traefik.yml
# После успешного запуска этот файл можно удалить.

on:
    workflow_dispatch:

jobs:
    fix-traefik:
        runs-on: ubuntu-latest

        steps:
            - name: Upgrade Traefik over SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  script: |
                      set -euo pipefail

                      TARGET_IMAGE="traefik:v3.6.17"
                      WORKDIR="/opt/traefik"
                      FILE="docker-compose.yml"
                      PROJECT="traefik"
                      SERVICE="traefik"

                      if docker compose version >/dev/null 2>&1; then
                          COMPOSE_CMD=(docker compose)
                      elif command -v docker-compose >/dev/null 2>&1; then
                          COMPOSE_CMD=(docker-compose)
                      else
                          echo "Docker Compose is not available on the deploy host"
                          exit 1
                      fi

                      cd "$WORKDIR"
                      test -f "$FILE"
                      echo "==> traefik compose: ${WORKDIR}/${FILE}, project: ${PROJECT}, service: ${SERVICE}"

                      echo "==> existing containers for ${PROJECT}/${SERVICE}"
                      docker ps -a \
                          --filter "label=com.docker.compose.project=${PROJECT}" \
                          --filter "label=com.docker.compose.service=${SERVICE}" \
                          --format '{{.Names}} {{.Image}} {{.Status}}'

                      # /opt/traefik принадлежит root, деплой-пользователь туда не пишет.
                      # Правим копию, а относительные пути (bind mounts, .env) резолвим через
                      # --project-directory в оригинальной директории Traefik.
                      PATCHED="$(mktemp /tmp/traefik-compose.XXXXXX.yml)"
                      sed -E "s#(image:[[:space:]]*)traefik:[^[:space:]\"']+#\\1${TARGET_IMAGE}#g" "$FILE" > "$PATCHED"
                      grep -q "$TARGET_IMAGE" "$PATCHED"
                      echo "==> patched image line:"
                      grep -n "image:.*traefik" "$PATCHED"

                      COMPOSE_ARGS=(-p "$PROJECT" --project-directory "$WORKDIR" -f "$PATCHED")
                      "${COMPOSE_CMD[@]}" "${COMPOSE_ARGS[@]}" pull "$SERVICE"

                      # docker-compose 1.29.2 падает с KeyError: 'ContainerConfig', когда
                      # пересоздаёт контейнер поверх существующего: современные образы больше
                      # не отдают это поле в image inspect. Этот код вызывается только при
                      # наличии предыдущего контейнера, поэтому сносим его по меткам (включая
                      # переименованный огрызок, оставшийся от упавшего --force-recreate) и
                      # создаём заново. Тот же приём, которым деплой обновляет site/site-php-fpm.
                      OLD="$(docker ps -aq \
                          --filter "label=com.docker.compose.project=${PROJECT}" \
                          --filter "label=com.docker.compose.service=${SERVICE}")"
                      if [ -n "$OLD" ]; then
                          echo "==> removing old containers: $OLD"
                          echo "$OLD" | xargs -r docker rm -f
                      fi

                      "${COMPOSE_CMD[@]}" "${COMPOSE_ARGS[@]}" up -d "$SERVICE"

                      # Закрепить правку на диске, иначе следующий `up` в /opt/traefik
                      # откатит Traefik обратно на старый тег.
                      if [ -w "$FILE" ]; then
                          cp "$FILE" "$FILE.bak-pre-v3.6.17" && cp "$PATCHED" "$FILE"
                          echo "==> ${WORKDIR}/${FILE} updated in place"
                      elif sudo -n true 2>/dev/null; then
                          sudo cp "$FILE" "$FILE.bak-pre-v3.6.17" && sudo cp "$PATCHED" "$FILE"
                          echo "==> ${WORKDIR}/${FILE} updated in place (sudo)"
                      else
                          echo "WARNING: no write access to ${WORKDIR}/${FILE}; it still pins the old tag."
                          echo "WARNING: container is upgraded, but update that file by hand or a future"
                          echo "WARNING: 'docker-compose up' in ${WORKDIR} will downgrade Traefik again."
                      fi
                      rm -f "$PATCHED"

                      echo "==> убрать мусор от сломанных запусков прежнего шага"
                      rm -f "${{ secrets.DEPLOY_PATH }}/docker-compose.yml.bak-pre-v3.6.17"

                      echo "==> wait for Traefik to rediscover containers"
                      sleep 15

                      echo "==> running image"
                      docker inspect traefik --format '{{.Config.Image}}'

                      echo "==> stale-API errors in the last 100 log lines (expect 0)"
                      docker logs --tail=100 traefik 2>&1 | grep -c "is too old" || true

                      echo "==> public HTTP check"
                      curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 --head https://vashfindir.ru/
