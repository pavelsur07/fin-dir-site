name: CI

# Проверки для PR и как первый шаг деплоя: deploy-vashfindir.yml зовёт этот
# workflow через `uses:` и раскатывает только после зелёного результата.
on:
    pull_request:
    workflow_call:

jobs:
    checks:
        runs-on: ubuntu-24.04
        # Use the same digest-pinned PHP as development and production. Runner
        # package installers may silently select a newer patch than requested.
        env:
            PHP_CI_CLI: docker compose --profile cli run --rm --user 0:0 -e COMPOSER_ALLOW_SUPERUSER=1 site-php-cli
            PHP_CI_TEST_CLI: docker compose --profile cli run --rm --user 0:0 -v ${{ github.workspace }}/SITE_RULES.md:/workspace/SITE_RULES.md:ro -v ${{ github.workspace }}/scripts:/workspace/scripts:ro site-php-cli

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Build pinned PHP runtime
              run: make build

            - name: Install locked dependencies
              run: make install CLI="$PHP_CI_CLI"

            - name: Check PHP runtime
              run: make php-runtime-check CLI="$PHP_CI_CLI"

            - name: Checks and tests
              id: tests
              run: make ci CLI="$PHP_CI_CLI" TEST_CLI="$PHP_CI_TEST_CLI" CMD="--log-junit phpunit-junit.xml"

            - name: Check design system classes
              run: make ds-check

            - name: Annotate test failures
              if: always() && steps.tests.outcome == 'failure'
              run: |
                  python3 - <<'PYTEST'
                  from pathlib import Path
                  import xml.etree.ElementTree as ET

                  report = Path('site/phpunit-junit.xml')
                  if report.exists():
                      for tc in ET.parse(report).iter('testcase'):
                          for failure in list(tc.iter('failure')) + list(tc.iter('error')):
                              name = f"{tc.get('classname')}::{tc.get('name')}"
                              detail = (failure.get('message') or '').strip() or (failure.text or '').strip()
                              detail = detail[:800].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                              print(f'::error title=Failed test::{name}: {detail}')
                  PYTEST

            - name: Stop test stack
              if: always()
              run: make down

    production-images:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v5
            - name: Check database backup and restore
              run: make site-database-backup-check
            - name: Build production artifacts
              run: make php-production-build
            - name: Check production runtime and HTTP authentication
              run: make php-production-smoke
