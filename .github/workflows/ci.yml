name: CI

# Проверки для PR и как первый шаг деплоя: deploy-vashfindir.yml зовёт этот
# workflow через `uses:` и раскатывает только после зелёного результата.
on:
    pull_request:
    workflow_call:

jobs:
    checks:
        runs-on: ubuntu-24.04

        # Integration- и functional-тесты ходят в site_test. Пароль -- только для CI.
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: site
                    POSTGRES_USER: site
                    POSTGRES_PASSWORD: secret
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U site -d site"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 10

        defaults:
            run:
                working-directory: site

        # dev, а не test: phpstan-symfony читает скомпилированный контейнер
        # из var/cache/dev. Реальные значения секретов здесь не нужны: в базу
        # ходят только тесты, и только в одноразовый postgres этого job.
        env:
            APP_ENV: dev
            APP_DEBUG: "1"
            APP_SECRET: ci-secret
            DEFAULT_URI: https://example.test
            DATABASE_URL: postgresql://site:secret@127.0.0.1:5432/site?serverVersion=17&charset=utf8
            # Фиктивный bcrypt-хеш: контейнеру нужно значение, вход в CI не выполняется.
            ADMIN_PASSWORD_HASH: $2y$04$FfV3wn2VKKju6pzPh32byeQGJpmCyArfOBkdE56c/p8zz0DB3pJ8.

        steps:
            - name: Checkout
              uses: actions/checkout@v5

            # Версия совпадает с php:8.4 в docker/development и docker/production.
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  tools: composer:v2
                  extensions: pdo_pgsql, pgsql, zip, bcmath, xml
                  coverage: none

            # Без --no-check-lock: рассинхрон composer.json и composer.lock
            # это как раз то, что здесь надо ловить.
            - name: Composer validate
              run: composer validate --strict

            - name: Composer install
              run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

            - name: Composer audit
              run: composer audit

            - name: Build and check Tailwind CSS
              working-directory: .
              run: make assets-check

            - name: Lint YAML
              run: php bin/console lint:yaml config

            - name: Lint Twig templates
              run: php bin/console lint:twig templates

            - name: Lint Symfony container
              run: php bin/console lint:container

            - name: Code style
              run: vendor/bin/php-cs-fixer check --diff

            - name: Static analysis
              run: |
                  php bin/console cache:warmup
                  vendor/bin/phpstan analyse --no-progress

            - name: Check architecture layers
              run: vendor/bin/deptrac analyse --config-file=deptrac.yaml --no-progress --report-uncovered

            - name: Prepare test database
              env:
                  APP_ENV: test
              run: |
                  php bin/console doctrine:database:create --if-not-exists
                  php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

            - name: Tests
              run: vendor/bin/phpunit
