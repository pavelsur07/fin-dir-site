name: Retire /opt/traefik

# Одноразовый инструмент. Конфиг Traefik переехал в репозиторий
# (infra/traefik/), контейнер уже поднят оттуда. Старая копия в /opt/traefik
# больше не источник правды: если её однажды запустят, получится расходящаяся
# конфигурация. Помечаем каталог выведенным из обращения.
#
# Каталог принадлежит root, sudo у деплой-пользователя нет, поэтому правим
# через контейнер с bind-mount: демон Docker работает от root.
#
# После запуска этот файл удаляется.

on:
    workflow_dispatch:

jobs:
    retire:
        runs-on: ubuntu-latest

        steps:
            - name: Retire /opt/traefik over SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  script: |
                      set -euo pipefail

                      echo "==> убеждаемся, что Traefik уже поднят из репозитория"
                      CFG="$(docker inspect traefik --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}')"
                      echo "config_files=${CFG}"
                      case "$CFG" in
                          */infra/traefik/docker-compose.yml) ;;
                          *) echo "Traefik поднят не из репозитория, выводить /opt/traefik рано"; exit 1 ;;
                      esac

                      echo "==> до"
                      ls -la /opt/traefik

                      docker run --rm -v /opt/traefik:/work -w /work alpine:3 sh -eux -c "
                          [ -f docker-compose.yml ] && mv docker-compose.yml docker-compose.yml.superseded || true
                          cat > README.superseded <<'EOF'
                      Конфигурация Traefik переехала в репозиторий fin-dir-site.

                          источник правды: <репозиторий>/infra/traefik/docker-compose.yml
                          на этом хосте:   /opt/vashfindir/infra/traefik/

                      Каталог оставлен только ради истории. Ничего отсюда не запускать:
                      docker-compose.yml.superseded разойдётся с репозиторием.

                      Применить изменения: workflow deploy-traefik.yml
                      Развернуть с нуля:   infra/traefik/README.md
                      EOF
                      "

                      echo "==> после"
                      ls -la /opt/traefik

                      echo "==> Traefik не затронут"
                      docker inspect traefik --format 'image={{.Config.Image}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}'

                      echo "==> сайт"
                      curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --head https://vashfindir.ru/
