name: Remove Docmost from host (one-off)

# Разовый снос стека Docmost (compose project vf-docmost) вместе с данными -- решение владельца.
# Запускать вручную после деплоя сайта, который забрал docs.vashfindir.ru; затем удалить этот файл.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    concurrency:
      group: host-deploy
      cancel-in-progress: false
    steps:
      - name: Remove Docmost containers, volumes, network and env
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            P=label=com.docker.compose.project=vf-docmost
            echo "==> containers"; docker ps -a --filter "$P" --format '{{.Names}} {{.Image}}'
            docker ps -aq --filter "$P" | xargs -r docker rm -f
            echo "==> volumes"; docker volume ls -q --filter "$P"
            docker volume ls -q --filter "$P" | xargs -r docker volume rm
            echo "==> networks"; docker network ls -q --filter "$P" | xargs -r docker network rm
            docker image rm docmost/docmost:0.97.0 2>/dev/null || true
            rm -f "$DEPLOY_PATH/docmost/.env"
            rmdir "$DEPLOY_PATH/docmost" 2>/dev/null || true
            echo "==> left"; docker ps -a --filter "$P" -q | wc -l; docker volume ls -q --filter "$P" | wc -l
            echo "==> docs host"
            body=$(curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 https://docs.vashfindir.ru/)
            grep -q 'База знаний в разработке' <<<"$body"
