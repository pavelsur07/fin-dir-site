name: Deploy vashfindir to production

on:
    push:
        branches: ["master", "main"]
        paths:
            - "site/**"
            - "docker-compose.prod.yml"
            - ".github/workflows/deploy-vashfindir.yml"
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_PHP_FPM: ${{ github.repository_owner }}/vashfindir-site-php-fpm
    IMAGE_PHP_CLI: ${{ github.repository_owner }}/vashfindir-site-php-cli
    IMAGE_TAG: sha-${{ github.sha }}

jobs:
    deploy:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        env:
            APP_ENV: test
            APP_SECRET: ci-secret
            DEFAULT_URI: https://example.test

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  tools: composer:v2
                  extensions: pdo_pgsql, pgsql, zip, bcmath, xml
                  coverage: none

            - name: Composer validate
              working-directory: site
              run: composer validate --strict --no-check-lock

            - name: Composer install
              working-directory: site
              run: composer install --no-dev --prefer-dist --no-interaction --no-progress --no-scripts --optimize-autoloader

            - name: Lint Twig templates
              working-directory: site
              run: php bin/console lint:twig templates

            - name: Lint Symfony container
              working-directory: site
              run: php bin/console lint:container

            - name: Login to GHCR
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

            - name: Build PHP-FPM image
              run: |
                  docker build \
                    -f site/docker/production/php-fpm/Dockerfile \
                    -t ${{ env.REGISTRY }}/${{ env.IMAGE_PHP_FPM }}:latest \
                    -t ${{ env.REGISTRY }}/${{ env.IMAGE_PHP_FPM }}:${{ env.IMAGE_TAG }} \
                    site

            - name: Push PHP-FPM image
              run: |
                  docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PHP_FPM }}:latest
                  docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PHP_FPM }}:${{ env.IMAGE_TAG }}

            - name: Build PHP-CLI image
              run: |
                  docker build \
                    -f site/docker/production/php-cli/Dockerfile \
                    -t ${{ env.REGISTRY }}/${{ env.IMAGE_PHP_CLI }}:latest \
                    -t ${{ env.REGISTRY }}/${{ env.IMAGE_PHP_CLI }}:${{ env.IMAGE_TAG }} \
                    site

            - name: Push PHP-CLI image
              run: |
                  docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PHP_CLI }}:latest
                  docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PHP_CLI }}:${{ env.IMAGE_TAG }}

            - name: Deploy Symfony over SSH
              uses: appleboy/ssh-action@v1.2.0
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  script: |
                      set -euo pipefail
                      
                      DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
                      COMPOSE_FILE="${DEPLOY_PATH}/docker-compose.prod.yml"
                      
                      echo "==> cd ${DEPLOY_PATH}"
                      cd "${DEPLOY_PATH}"
                      
                      echo "==> git sync"
                      git fetch --all --prune
                      git reset --hard origin/${{ github.ref_name }}
                      
                      echo "==> export env"
                      export VF_SITE_APP_SECRET='${{ secrets.VF_SITE_APP_SECRET }}'
                      export GHCR_OWNER='${{ github.repository_owner }}'
                      export IMAGE_TAG='${{ env.IMAGE_TAG }}'
                      
                      echo "==> docker login to GHCR"
                      echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ github.repository_owner }}' --password-stdin
                      
                      if docker compose version >/dev/null 2>&1; then
                          COMPOSE_CMD=(docker compose)
                      elif command -v docker-compose >/dev/null 2>&1; then
                          COMPOSE_CMD=(docker-compose)
                      else
                          echo "Docker Compose is not available on the deploy host"
                          exit 1
                      fi

                      # Имя проекта закреплено явно. compose v1 и v2 по-разному
                      # выводят его из имени каталога, и расхождение развело бы
                      # деплой с уже работающими контейнерами (project=vashfindir).
                      COMPOSE=("${COMPOSE_CMD[@]}" -p vashfindir -f "${COMPOSE_FILE}")
                      
                      echo "==> render compose config"
                      "${COMPOSE[@]}" config > /tmp/vashfindir.compose.rendered.yml
                      
                      echo "==> pull Symfony images"
                      "${COMPOSE[@]}" pull site-php-fpm site-php-cli
                      
                      echo "==> stop Symfony only"
                      "${COMPOSE[@]}" stop site site-php-fpm 2>/dev/null || true
                      
                      echo "==> remove old Symfony containers"
                      "${COMPOSE[@]}" rm -f site site-php-fpm 2>/dev/null || true
                      
                      echo "==> start Symfony FPM"
                      "${COMPOSE[@]}" up -d --no-deps site-php-fpm
                      
                      echo "==> start Symfony Nginx"
                      "${COMPOSE[@]}" up -d --no-deps site
                      
                      echo "==> status"
                      "${COMPOSE[@]}" ps site site-php-fpm
                      
                      echo "==> logs: site"
                      "${COMPOSE[@]}" logs --tail=120 site || true
                      
                      echo "==> logs: site-php-fpm"
                      "${COMPOSE[@]}" logs --tail=120 site-php-fpm || true
                      
                      echo "==> Symfony health (inside container)"
                      "${COMPOSE[@]}" exec -T site sh -lc 'wget -qO- http://127.0.0.1/health | grep -qx "alive"'
                      
                      echo "==> Traefik diagnostics"
                      docker inspect vashfindir_site --format '{{json .Config.Labels}}'
                      docker inspect vashfindir_site --format '{{json .NetworkSettings.Networks}}'
                      # Status показывает аптайм: если он перекрывает время деплоя, значит
                      # деплой Traefik не трогал. Деплой и не должен -- Traefik это общая
                      # инфраструктура хоста, у неё свой пайплайн deploy-traefik.yml.
                      docker ps --filter name=traefik --format '{{.ID}} {{.Names}} {{.Image}} up_for={{.Status}} {{.Networks}}'

                      echo "==> public HTTP check"
                      curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 3 --head https://vashfindir.ru/
