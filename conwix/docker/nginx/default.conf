# conwix.com -- чистая статика. Ни PHP, ни upstream'ов: раздаётся то, что
# лежит в conwix/public, примонтированном сюда bind-mount'ом.

server {
    listen 80;
    server_name _;

    root /app/public;
    index index.html;

    # Ссылки внутри сайта ведут на .html напрямую (oferta.html и т.д.),
    # поэтому переписывать URL не нужно.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "alive\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # У файлов нет хэша в имени: style.css после выкатки остаётся style.css.
    # Поэтому НЕ immutable и не 30d -- иначе правка контента доедет до
    # вернувшегося посетителя через месяц. Час это компромисс: повторные
    # запросы в рамках одного визита из кеша, релиз виден в тот же день.
    location ~* \.(?:css|js|json|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        log_not_found off;
        # Один заголовок, а не expires + add_header: та пара отдаёт
        # Cache-Control дважды (max-age отдельно, public отдельно).
        add_header Cache-Control "public, max-age=3600";
    }

    # HTML всегда перепроверяется: он и есть точка входа для всего остального.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # README.md, info.md и package.json приехали из шаблона, по которому
    # собран сайт: это руководство по сборке, а не контент. В git они нужны,
    # наружу отдавать их нечего.
    #
    # Именно `location =`, а не общий регексп по .json: vendor/land-110m.json --
    # данные карты, их отдавать надо. Точное совпадение в nginx приоритетнее
    # любого регекспа, поэтому от порядка блоков результат не зависит.
    location = /package.json      { deny all; }
    location = /package-lock.json { deny all; }

    location ~* \.md$ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
