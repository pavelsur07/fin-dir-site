# Independent application: never merge this file into the Symfony Compose project.
name: vf-docmost

services:
  docmost:
    image: docmost/docmost:0.97.0@sha256:40c454d74ffdd9ecb15833e4d96f3a630d59aad862a1869381ae6ee086454419
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_URL: https://docs.vashfindir.ru
      APP_SECRET: ${DOCMOST_APP_SECRET:?Set DOCMOST_APP_SECRET in docmost/.env}
      DATABASE_URL: postgresql://docmost:${DOCMOST_DB_PASSWORD:?Set DOCMOST_DB_PASSWORD in docmost/.env}@db:5432/docmost
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: local
      MAIL_DRIVER: smtp
      SMTP_HOST: ${DOCMOST_SMTP_HOST:-}
      SMTP_PORT: ${DOCMOST_SMTP_PORT:-587}
      SMTP_USERNAME: ${DOCMOST_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${DOCMOST_SMTP_PASSWORD:-}
      SMTP_SECURE: ${DOCMOST_SMTP_SECURE:-false}
      MAIL_FROM_ADDRESS: ${DOCMOST_MAIL_FROM_ADDRESS:-}
      MAIL_FROM_NAME: Ваш ФинДиректор — Документация
    # Bootstrap through an SSH tunnel before enabling the public router.
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - storage:/app/data/storage
    networks:
      - private
      - web
    labels:
      traefik.enable: ${DOCMOST_PUBLIC:-false}
      traefik.docker.network: traefik_web
      traefik.http.routers.vf-docmost.rule: Host(`docs.vashfindir.ru`)
      traefik.http.routers.vf-docmost.entrypoints: websecure
      traefik.http.routers.vf-docmost.tls.certresolver: le
      traefik.http.routers.vf-docmost.service: vf-docmost
      # Public landing page; editing/authentication keep their original routes.
      traefik.http.routers.vf-docmost-home.rule: Host(`docs.vashfindir.ru`) && Path(`/`)
      traefik.http.routers.vf-docmost-home.entrypoints: websecure
      traefik.http.routers.vf-docmost-home.tls.certresolver: le
      traefik.http.routers.vf-docmost-home.service: vf-docmost
      traefik.http.routers.vf-docmost-home.priority: "100"
      traefik.http.routers.vf-docmost-home.middlewares: vf-docmost-home
      traefik.http.middlewares.vf-docmost-home.redirectregex.regex: ^https?://docs[.]vashfindir[.]ru/.*
      traefik.http.middlewares.vf-docmost-home.redirectregex.replacement: https://docs.vashfindir.ru/share/hn9f97nx4m/p/vaIvbFr1b5
      traefik.http.middlewares.vf-docmost-home.redirectregex.permanent: "false"
      traefik.http.routers.vf-docmost-http.rule: Host(`docs.vashfindir.ru`)
      traefik.http.routers.vf-docmost-http.entrypoints: web
      traefik.http.routers.vf-docmost-http.middlewares: vf-docmost-https
      traefik.http.routers.vf-docmost-http.service: vf-docmost
      traefik.http.middlewares.vf-docmost-https.redirectscheme.scheme: https
      traefik.http.middlewares.vf-docmost-https.redirectscheme.permanent: "true"
      traefik.http.services.vf-docmost.loadbalancer.server.port: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${DOCMOST_DB_PASSWORD:?Set DOCMOST_DB_PASSWORD in docmost/.env}
    volumes:
      # PostgreSQL 18 stores PGDATA below this directory.
      - database:/var/lib/postgresql
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmost -d docmost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.3-alpine@sha256:71885d8cc6e42f2bc0aa2eb853bfc4be200b5108a46ac50e117ae1df0531fb80
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  storage:
  database:
  redis:

networks:
  private:
    internal: true
  web:
    external: true
    name: traefik_web
