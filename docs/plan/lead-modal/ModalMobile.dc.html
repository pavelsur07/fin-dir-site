<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Всплывающее окно — mobile</title><script src="./support.js"></script></head>
<body><x-dc><helmet><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"><style>body{margin:0}input:focus,button:focus-visible{outline:2px solid #1E40AF;outline-offset:2px}</style></helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; color: #0B1020; font-family: Inter, 'Helvetica Neue', Arial, sans-serif">
<div aria-hidden="true" style="position: absolute; inset: 0; padding: 16px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; justify-content: space-between"><img src="/_blob/b00e6e342dc6cc08d0220620415c5b01" alt="" style="height: 26px"></div>
<div style="flex: 1; border-radius: 28px; background: #F2F5FB; border: 1px solid #DCE3EE"></div></div>
<sc-if value="{{isOpen}}" hint-placeholder="true"><div style="position: absolute; inset: 0; background: rgba(11,16,32,0.6)"><div role="dialog" aria-modal="true" aria-labelledby="modal-title" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 94%; overflow-y: auto; border-radius: 24px 24px 0 0; background: #FFFFFF; box-shadow: 0 -20px 60px rgba(11,16,32,0.3)">
<div style="position: relative; overflow: hidden; background: #1E40AF; color: #FFFFFF; padding: 28px 20px 24px; display: flex; flex-direction: column; gap: 14px">
<div aria-hidden="true" style="position: absolute; top: -10%; bottom: -10%; left: 62%; width: 30%; transform: skewX(-14deg); background: #2D52C4"></div>
<span aria-hidden="true" style="position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 40px; height: 4px; border-radius: 9999px; background: rgba(255,255,255,0.4)"></span>
<div style="position: relative; display: flex; flex-wrap: wrap; gap: 6px"><span style="display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px; border-radius: 9999px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.14); color: #FFFFFF">Бесплатно</span><span style="display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px; border-radius: 9999px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.14); color: #FFFFFF">45 минут</span><span style="display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px; border-radius: 9999px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.14); color: #FFFFFF">Онлайн</span></div>
<h2 id="modal-title" style="position: relative; margin: 0; max-width: 8.5em; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em">Покажем, где ваш бизнес теряет прибыль</h2>
<ul style="position: relative; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; max-width: 15em"><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.45; color: #E3EAFE"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9C1FA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><path d="M20 6 9 17l-5-5"></path></svg><span>Разберём движение денег и прибыль по направлениям</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.45; color: #E3EAFE"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9C1FA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><path d="M20 6 9 17l-5-5"></path></svg><span>Покажем кабинет на примере ваших цифр</span></li><li style="display: flex; gap: 10px; font-size: 15px; line-height: 1.45; color: #E3EAFE"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9C1FA" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><path d="M20 6 9 17l-5-5"></path></svg><span>Для селлеров — маржа до CM3 по товарам</span></li></ul>
<img src="/_blob/20e06709f9a0ecc0f4710ccd51a34f6a" alt="Павел Новиков, управляющий партнёр" style="position: absolute; right: -36px; bottom: 0; height: 230px; width: auto">
</div>
<div style="padding: 20px 20px 24px"><form onSubmit="{{submit}}" style="display: flex; flex-direction: column; gap: 14px" novalidate>
<sc-if value="{{notSent}}" hint-placeholder="true">
<div style="display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: #334155">Как вас зовут</span><input type="text" autocomplete="name" placeholder="Имя" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; border-radius: 10px; border: 1px solid #DCE3EE; background: #F2F5FB; font: inherit; font-size: 16px; color: #0B1020"></label>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px"><legend style="font-size: 13px; font-weight: 600; color: #334155; padding: 0; margin-bottom: 6px">Как с вами связаться</legend>
<div role="radiogroup" aria-label="Способ связи" style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #E6EDFA">
<sc-if value="{{isPhone}}" hint-placeholder="true"><button type="button" role="radio" aria-checked="true" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(11,16,32,0.12); font: inherit; font-size: 15px; font-weight: 600; color: #0B1020; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>Телефон</button><button type="button" role="radio" aria-checked="false" onClick="{{pickTg}}" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; border: 0; border-radius: 8px; background: transparent; font: inherit; font-size: 15px; font-weight: 500; color: #475569; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>Telegram</button></sc-if>
<sc-if value="{{isTg}}" hint-placeholder="false"><button type="button" role="radio" aria-checked="false" onClick="{{pickPhone}}" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; border: 0; border-radius: 8px; background: transparent; font: inherit; font-size: 15px; font-weight: 500; color: #475569; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>Телефон</button><button type="button" role="radio" aria-checked="true" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; border: 0; border-radius: 8px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(11,16,32,0.12); font: inherit; font-size: 15px; font-weight: 600; color: #0B1020; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"></path><path d="M22 2 11 13"></path></svg>Telegram</button></sc-if>
</div>
<sc-if value="{{isPhone}}" hint-placeholder="true"><input type="tel" inputmode="tel" autocomplete="tel" aria-label="Телефон" placeholder="+7 900 000-00-00" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; border-radius: 10px; border: 1px solid #DCE3EE; background: #F2F5FB; font: inherit; font-size: 16px; color: #0B1020"></sc-if>
<sc-if value="{{isTg}}" hint-placeholder="false"><input type="text" autocomplete="off" aria-label="Telegram" placeholder="@username" style="box-sizing: border-box; width: 100%; height: 52px; padding: 0 16px; border-radius: 10px; border: 1px solid #DCE3EE; background: #F2F5FB; font: inherit; font-size: 16px; color: #0B1020"></sc-if>
</fieldset>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 12px; line-height: 1.45; color: #475569"><input type="checkbox" style="margin: 2px 0 0; width: 18px; height: 18px; flex: none; accent-color: #1E40AF"><span>Даю согласие на <a href="#consent" style="color: #1E40AF">обработку персональных данных</a> и принимаю <a href="#privacy" style="color: #1E40AF">политику конфиденциальности</a></span></label>
<button type="submit" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 54px; border: 0; border-radius: 12px; background: #1E40AF; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Записаться на разбор<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button>
<button type="button" onClick="{{close}}" style="height: 40px; border: 0; background: transparent; font: inherit; font-size: 15px; font-weight: 500; color: #475569; cursor: pointer">Не сейчас</button>
</div></sc-if>
<sc-if value="{{sent}}" hint-placeholder="false">
<div role="status" style="display: flex; flex-direction: column; gap: 12px; padding: 24px 0">
<span style="width: 48px; height: 48px; border-radius: 9999px; background: #E6F4EE; color: #0F7B52; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span>
<span style="font-size: 22px; font-weight: 700">Заявка отправлена</span><span style="font-size: 15px; line-height: 1.5; color: #475569">Свяжемся в рабочее время и договоримся о времени разбора.</span>
<button type="button" onClick="{{close}}" style="align-self: flex-start; height: 44px; padding: 0 20px; border-radius: 10px; border: 1.5px solid #0B1020; background: transparent; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Закрыть</button>
</div></sc-if>
</form></div>
<button type="button" aria-label="Закрыть" onClick="{{close}}" style="position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 9999px; border: 0; background: rgba(255,255,255,0.18); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div></div></sc-if>
<sc-if value="{{closed}}" hint-placeholder="false"><div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center"><button type="button" onClick="{{open}}" style="height: 52px; padding: 0 24px; border-radius: 12px; border: 0; background: #1E40AF; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Показать окно снова</button></div></sc-if>
</div></x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const isOpen = st.open !== false;
const sent = !!st.sent;
const tg = st.contact === 'telegram';
return {
isOpen, closed: !isOpen, sent, notSent: !sent, isPhone: !tg, isTg: tg,
pickPhone: () => this.setState({ contact: 'phone' }),
pickTg: () => this.setState({ contact: 'telegram' }),
close: () => this.setState({ open: false, sent: false }),
open: () => this.setState({ open: true, sent: false }),
submit: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ sent: true }); },
};
}
}
</script></body></html>
