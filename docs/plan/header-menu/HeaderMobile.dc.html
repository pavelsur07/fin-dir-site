<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>

.hm-item:hover{background:#F2F5FB}

<button type="button" aria-label="Открыть меню" aria-expanded="{{drawerExpanded}}" onClick="{{openDrawer}}" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #94A3B8; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #0B1020; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="6" y2="6"></line><line x1="4" x2="20" y1="12" y2="12"></line><line x1="4" x2="20" y1="18" y2="18"></line></svg></button></header>

<div role="dialog" aria-modal="true" aria-label="Меню" style="position: absolute; top: 0; right: 0; bottom: 0; width: 86%; max-width: 360px; display: flex; flex-direction: column; background: #FFFFFF; box-shadow: -16px 0 40px rgba(11,16,32,0.18)">
<div style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 64px; padding: 0 12px 0 16px; border-bottom: 1px solid #DCE3EE">

<button type="button" aria-label="Закрыть меню" onClick="{{closeDrawer}}" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid #94A3B8; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #0B1020; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>

<span style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600">Финансовая модель</span></a></li><li><a href="#accounting" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 4px 10px; border-radius: 12px; text-decoration: none; color: #0B1020">
<span style="flex: none; width: 34px; height: 34px; border-radius: 10px; background: #FFFFFF; color: #1E40AF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"></rect><line x1="8" x2="16" y1="6" y2="6"></line><line x1="16" x2="16" y1="14" y2="18"></line><path d="M16 10h.01"></path><path d="M12 10h.01"></path><path d="M8 10h.01"></path><path d="M12 14h.01"></path><path d="M8 14h.01"></path><path d="M12 18h.01"></path><path d="M8 18h.01"></path></svg></span>

<span style="flex: none; width: 34px; height: 34px; border-radius: 10px; background: #FFFFFF; color: #1E40AF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg></span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600">Сервис ВФ<span style="display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; border-radius: 9999px; background: #E6F4EE; color: #0F7B52; font-size: 12px; font-weight: 600">Онлайн</span></span></a></li><li><a href="#services" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; font-size: 15px; font-weight: 600; color: {{accent}}; text-decoration: none">Все услуги и цены<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a></li></ul></sc-if></li>
<li><a href="#cases" style="position: relative; display: flex; align-items: center; min-height: 52px; padding: 0 4px; border-bottom: 1px solid #DCE3EE; font-size: 18px; font-weight: 500; text-decoration: none; color: #0B1020">Кейсы</a></li><li><a href="#paper" aria-current="page" style="position: relative; display: flex; align-items: center; min-height: 52px; padding: 0 4px; border-bottom: 1px solid #DCE3EE; font-size: 18px; font-weight: 700; text-decoration: none; color: #0B1020">Газета<span aria-hidden="true" style="margin-left: 10px; width: 6px; height: 6px; border-radius: 9999px; background: #1E40AF"></span></a></li><li><a href="#partners" style="position: relative; display: flex; align-items: center; min-height: 52px; padding: 0 4px; border-bottom: 1px solid #DCE3EE; font-size: 18px; font-weight: 500; text-decoration: none; color: #0B1020">Партнёрам</a></li><li><a href="#about" style="position: relative; display: flex; align-items: center; min-height: 52px; padding: 0 4px; border-bottom: 1px solid #DCE3EE; font-size: 18px; font-weight: 500; text-decoration: none; color: #0B1020">О компании</a></li>
</ul></nav>
<div style="flex: none; padding: 16px; border-top: 1px solid #DCE3EE; display: flex; flex-direction: column; gap: 10px">
<a href="#lead-modal" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none">Записаться на разбор<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>

<a href="tel:+79991234567" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; font-size: 15px; font-weight: 600; color: #0B1020; text-decoration: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>+7 (999) 123-45-67 <span style="font-weight: 400; color: #475569">· Пн–Пт 9–18</span></a>
</div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1E40AF","options":["#1E40AF","#2563EB","#0F7B52"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const open = st.open !== false;
return {
accent: this.props.accent ?? '#1E40AF',
isOpen: open,
expanded: open ? 'true' : 'false',
chevStyle: open ? 'transform: rotate(180deg)' : '',
btnStyle: open ? 'color: #1E40AF' : '',
toggle: () => this.setState({ open: !open }),
drawerOpen: st.drawer !== false,
drawerExpanded: st.drawer !== false ? 'true' : 'false',
openDrawer: () => this.setState({ drawer: true }),
closeDrawer: () => this.setState({ drawer: false }),
};
}
}
</script>
</body>
</html>
