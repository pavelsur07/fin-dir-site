services:
    site-nginx:
        image: nginx:1.27-alpine
        container_name: vashfindir_site_nginx
        restart: always
        depends_on:
            - site-php-fpm
        ports:
            - "8001:80"
        volumes:
            - ./site:/app
            - ./site/docker/common/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    site-php-fpm:
        image: vashfindir-site-php-fpm:dev
        container_name: vashfindir_site_php_fpm
        build:
            context: ./site
            dockerfile: docker/development/php-fpm/Dockerfile
        restart: always
        working_dir: /app
        environment:
            APP_ENV: dev
            APP_DEBUG: "1"
            APP_SECRET: dev-site-secret
            DEFAULT_URI: http://localhost:8001
            DATABASE_URL: "postgresql://site:secret@site-postgres:5432/site?serverVersion=17&charset=utf8"
        depends_on:
            site-postgres:
                condition: service_healthy
        volumes:
            - ./site:/app
        expose:
            - "9000"

    site-postgres:
        image: postgres:17-alpine
        container_name: vashfindir_site_postgres
        restart: always
        environment:
            TZ: Europe/Moscow
            POSTGRES_DB: site
            POSTGRES_USER: site
            POSTGRES_PASSWORD: secret
        volumes:
            - postgres_data:/var/lib/postgresql/data
        # ponytail: порт на хост не публикуем -- приложение ходит по сети compose.
        # Нужен DataGrip/psql с хоста -- добавить ports: ["15432:5432"].
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U site -d site"]
            interval: 5s
            timeout: 3s
            retries: 10

    site-php-cli:
        profiles:
            - cli
        image: vashfindir-site-php-cli:dev
        container_name: vashfindir_site_php_cli
        build:
            context: ./site
            dockerfile: docker/development/php-cli/Dockerfile
        working_dir: /app
        environment:
            APP_ENV: dev
            APP_DEBUG: "1"
            APP_SECRET: dev-site-secret
            DEFAULT_URI: http://localhost:8001
            DATABASE_URL: "postgresql://site:secret@site-postgres:5432/site?serverVersion=17&charset=utf8"
        depends_on:
            site-postgres:
                condition: service_healthy
        volumes:
            - ./site:/app
        command: ["sh"]

volumes:
    postgres_data:
