
version: "3.9"

services:
  site:
    container_name: vashfindir_site
    image: nginx:1.27-alpine
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_web"

      - "traefik.http.routers.vf-new.rule=Host(`vashfindir.ru`)"
      - "traefik.http.routers.vf-new.entrypoints=websecure"
      - "traefik.http.routers.vf-new.tls.certresolver=le"

      - "traefik.http.routers.vf-new-http.rule=Host(`vashfindir.ru`)"
      - "traefik.http.routers.vf-new-http.entrypoints=web"
      - "traefik.http.routers.vf-new-http.middlewares=vf-new-https-redirect"
      - "traefik.http.middlewares.vf-new-https-redirect.redirectscheme.scheme=https"

      # www -> apex, 301. $${1} -- не опечатка: compose съедает одиночный $,
      # до Traefik должно дойти ${1}.
      - "traefik.http.routers.vf-www.rule=Host(`www.vashfindir.ru`)"
      - "traefik.http.routers.vf-www.entrypoints=websecure"
      - "traefik.http.routers.vf-www.tls.certresolver=le"
      - "traefik.http.routers.vf-www.middlewares=vf-www-to-apex"

      - "traefik.http.routers.vf-www-http.rule=Host(`www.vashfindir.ru`)"
      - "traefik.http.routers.vf-www-http.entrypoints=web"
      - "traefik.http.routers.vf-www-http.middlewares=vf-www-to-apex"

      - "traefik.http.middlewares.vf-www-to-apex.redirectregex.regex=^https?://www\\.vashfindir\\.ru/(.*)"
      - "traefik.http.middlewares.vf-www-to-apex.redirectregex.replacement=https://vashfindir.ru/$${1}"
      - "traefik.http.middlewares.vf-www-to-apex.redirectregex.permanent=true"

      - "traefik.http.services.vf-new.loadbalancer.server.port=80"
    volumes:
      - ./site/public:/app/public:ro
      - ./site/docker/common/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - site-php-fpm
    networks:
      - web
      - internal

  site-php-fpm:
    container_name: vashfindir_site_php_fpm
    image: ghcr.io/${GHCR_OWNER:-pavelsur07}/vashfindir-site-php-fpm:${IMAGE_TAG:-latest}
    restart: always
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${VF_SITE_APP_SECRET:?VF_SITE_APP_SECRET is required}
      DEFAULT_URI: https://vashfindir.ru
    expose:
      - "9000"
    networks:
      - internal

  site-php-cli:
    profiles:
      - cli
    container_name: vashfindir_site_php_cli
    image: ghcr.io/${GHCR_OWNER:-pavelsur07}/vashfindir-site-php-cli:${IMAGE_TAG:-latest}
    working_dir: /app
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${VF_SITE_APP_SECRET:?VF_SITE_APP_SECRET is required}
      DEFAULT_URI: https://vashfindir.ru
    networks:
      - internal
    command: ["sh"]

networks:
  web:
    external: true
    name: traefik_web
  internal:
    external: false
