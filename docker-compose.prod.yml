services:
  site:
    container_name: vashfindir_site
    image: nginx:1.27-alpine
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_web"

      - "traefik.http.routers.vf-new.rule=Host(`vashfindir.ru`)"
      - "traefik.http.routers.vf-new.entrypoints=websecure"
      - "traefik.http.routers.vf-new.tls.certresolver=le"


      - "traefik.http.routers.vf-new-http.rule=Host(`vashfindir.ru`)"
      - "traefik.http.routers.vf-new-http.entrypoints=web"
      - "traefik.http.routers.vf-new-http.middlewares=vf-new-https-redirect"
      - "traefik.http.middlewares.vf-new-https-redirect.redirectscheme.scheme=https"

      # www -> apex, 301. $${1} -- не опечатка: compose съедает одиночный $,
      # до Traefik должно дойти ${1}.
      - "traefik.http.routers.vf-www.rule=Host(`www.vashfindir.ru`)"
      - "traefik.http.routers.vf-www.entrypoints=websecure"
      - "traefik.http.routers.vf-www.tls.certresolver=le"
      - "traefik.http.routers.vf-www.middlewares=vf-www-to-apex"

      - "traefik.http.routers.vf-www-http.rule=Host(`www.vashfindir.ru`)"
      - "traefik.http.routers.vf-www-http.entrypoints=web"
      - "traefik.http.routers.vf-www-http.middlewares=vf-www-to-apex"

      - "traefik.http.middlewares.vf-www-to-apex.redirectregex.regex=^https?://www\\.vashfindir\\.ru/(.*)"
      - "traefik.http.middlewares.vf-www-to-apex.redirectregex.replacement=https://vashfindir.ru/$${1}"
      - "traefik.http.middlewares.vf-www-to-apex.redirectregex.permanent=true"

      # docs.vashfindir.ru -> тот же Symfony: заглушка базы знаний (DocsStubController).
      - "traefik.http.routers.vf-docs.rule=Host(`docs.vashfindir.ru`)"
      - "traefik.http.routers.vf-docs.entrypoints=websecure"
      - "traefik.http.routers.vf-docs.tls.certresolver=le"
      - "traefik.http.routers.vf-docs.service=vf-new"

      - "traefik.http.routers.vf-docs-http.rule=Host(`docs.vashfindir.ru`)"
      - "traefik.http.routers.vf-docs-http.entrypoints=web"
      - "traefik.http.routers.vf-docs-http.middlewares=vf-new-https-redirect"
      - "traefik.http.routers.vf-docs-http.service=vf-new"

      - "traefik.http.services.vf-new.loadbalancer.server.port=80"
    volumes:
      - ./site/public:/app/public:ro
      # Обложки статей: пишет php-fpm, nginx только раздаёт.
      - site_uploads:/app/public/uploads:ro
      - ./site/docker/common/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - site-php-fpm
    networks:
      - web
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  site-php-fpm:
    # container_name намеренно НЕ задан: с фиксированным именем сервис нельзя
    # держать в нескольких репликах, а без второй реплики выкатка неизбежно
    # оставляет окно, когда обслуживать запрос некому.
    image: ghcr.io/${GHCR_OWNER:-pavelsur07}/vashfindir-site-php-fpm:${IMAGE_TAG:-latest}
    restart: always
    deploy:
      replicas: 2
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${VF_SITE_APP_SECRET:?VF_SITE_APP_SECRET is required}
      DEFAULT_URI: https://vashfindir.ru
      DOCS_MCP_HTTP_ENABLED: ${VF_DOCS_MCP_HTTP_ENABLED:-0}
      DOCS_MCP_OAUTH_ISSUER: ${VF_DOCS_MCP_OAUTH_ISSUER:-}
      DATABASE_URL: "postgresql://site:${VF_SITE_DB_PASSWORD:?VF_SITE_DB_PASSWORD is required}@site-postgres:5432/site?serverVersion=17&charset=utf8"
      ADMIN_PASSWORD_HASH: ${VF_ADMIN_PASSWORD_HASH:?VF_ADMIN_PASSWORD_HASH is required}
      # Необязательны: без них заявки сохраняются, но уведомления в Telegram не уходят.
      LEAD_RELAY_URL: ${VF_LEAD_RELAY_URL:-}
      LEAD_RELAY_TOKEN: ${VF_LEAD_RELAY_TOKEN:-}
    depends_on:
      site-postgres:
        condition: service_healthy
    expose:
      - "9000"
    volumes:
      # Все реплики пишут в один том; имена файлов случайные, конфликтов нет.
      - site_uploads:/app/public/uploads
    networks:
      - internal
    healthcheck:
      # php-fpm не отвечает по HTTP, поэтому проверяем, что он принял
      # соединение на своём порту. php уже есть в образе -- лишних пакетов не надо.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  site-php-cli:
    profiles:
      - cli
    container_name: vashfindir_site_php_cli
    image: &site_php_cli_image ghcr.io/${GHCR_OWNER:-pavelsur07}/vashfindir-site-php-cli:${IMAGE_TAG:-latest}
    working_dir: /app
    environment: &site_php_cli_env
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${VF_SITE_APP_SECRET:?VF_SITE_APP_SECRET is required}
      DEFAULT_URI: https://vashfindir.ru
      DOCS_MCP_HTTP_ENABLED: ${VF_DOCS_MCP_HTTP_ENABLED:-0}
      DOCS_MCP_OAUTH_ISSUER: ${VF_DOCS_MCP_OAUTH_ISSUER:-}
      DATABASE_URL: "postgresql://site:${VF_SITE_DB_PASSWORD:?VF_SITE_DB_PASSWORD is required}@site-postgres:5432/site?serverVersion=17&charset=utf8"
      ADMIN_PASSWORD_HASH: ${VF_ADMIN_PASSWORD_HASH:?VF_ADMIN_PASSWORD_HASH is required}
      # Необязательны: без них заявки сохраняются, но уведомления в Telegram не уходят.
      LEAD_RELAY_URL: ${VF_LEAD_RELAY_URL:-}
      LEAD_RELAY_TOKEN: ${VF_LEAD_RELAY_TOKEN:-}
    networks:
      - internal
    command: ["sh"]

  site-scheduler:
    profiles:
      - scheduler
    container_name: vashfindir_site_scheduler
    image: *site_php_cli_image
    pull_policy: never
    restart: unless-stopped
    # crond требуется root внутри контейнера. Symfony запускается от app.
    user: root
    environment:
      <<: *site_php_cli_env
      TZ: Europe/Moscow
      SITE_RELEASE_TAG: ${IMAGE_TAG:-}
    networks:
      - internal
    tmpfs:
      - /run/vashfindir-lead-purge
    configs:
      - source: lead_purge_crontab
        target: /etc/crontabs/root
      - source: lead_purge_script
        target: /etc/vashfindir/lead-purge.sh
    command:
      - /bin/sh
      - -ec
      - |
        if ! printf '%s\n' "$$SITE_RELEASE_TAG" | grep -Eq '^sha-[0-9a-f]{40}$$'; then
          echo 'site-scheduler requires IMAGE_TAG=sha-<commit>' >&2
          exit 1
        fi
        su -s /bin/sh -c 'php bin/console help app:lead:purge-expired --no-interaction --no-ansi' app >/dev/null
        echo "site-scheduler release=$$SITE_RELEASE_TAG schedule=03:00 Europe/Moscow"
        exec crond -f -d 8 -c /etc/crontabs
    logging:
      driver: journald
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = crond"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s

  site-postgres:
    container_name: vashfindir_site_postgres
    image: postgres:17-alpine
    restart: always
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: site
      POSTGRES_USER: site
      POSTGRES_PASSWORD: ${VF_SITE_DB_PASSWORD:?VF_SITE_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Только internal: наружу база не торчит ни портом, ни через Traefik.
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site -d site"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  # Данные живут в томе и переживают пересоздание контейнера. Деплой базу
  # не пересоздаёт: обычный up -d -- no-op, пока конфигурация не менялась.
  postgres_data:
  # Загруженные обложки статей. Бэкапить вместе с базой: в базе только имена файлов.
  site_uploads:

configs:
  lead_purge_crontab:
    content: |
      0 3 * * * /bin/sh /etc/vashfindir/lead-purge.sh
  lead_purge_script:
    content: |
      set -eu
      state=/run/vashfindir-lead-purge
      exec 9>"$$state/lock"

      if [ "$${1:-}" = --pause ]; then
        # Сначала дождаться текущей очистки, затем запретить новые запуски до остановки.
        flock 9
        touch "$$state/paused"
        exit 0
      fi

      # Вывод docker exec тоже должен остаться в журнале контейнера.
      exec >/proc/1/fd/1 2>/proc/1/fd/2
      if ! flock -n 9 || [ -e "$$state/paused" ]; then
        echo 'app:lead:purge-expired skipped: busy or paused (exit=75)' >&2
        exit 75
      fi

      cd /app
      echo "app:lead:purge-expired start release=$$SITE_RELEASE_TAG"
      status=0
      su -s /bin/sh -c 'exec php bin/console app:lead:purge-expired --no-interaction --no-ansi' app || status=$$?
      printf 'app:lead:purge-expired exit=%s\n' "$$status"
      exit "$$status"

networks:
  web:
    external: true
    name: traefik_web
  internal:
    external: false
