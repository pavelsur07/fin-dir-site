server {
    listen 80;
    server_name _;

    root /app/public;
    index index.php;

    client_max_body_size 32M;
    # valid=1s -- во время выкатки php-fpm меняет адреса, и nginx должен
    # перечитывать DNS Docker быстро, а не держать запись до перезапуска
    resolver 127.0.0.11 ipv6=off valid=1s;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "alive\n";
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        log_not_found off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.php {
        internal;
        include fastcgi_params;

        # Адрес обязан идти через переменную. Со статическим fastcgi_pass nginx
        # резолвит имя один раз при старте и потом вечно стучится в IP уже
        # умершего контейнера -- поэтому раньше nginx приходилось пересоздавать
        # после каждой выкатки php-fpm, а это и давало 404 на время деплоя.
        set $fpm_upstream site-php-fpm:9000;
        fastcgi_pass $fpm_upstream;

        # Реплик php-fpm несколько. Если попали в ту, которую сейчас
        # пересоздают, пробуем следующую вместо отдачи 502.
        # http_502 тут невалиден -- это параметр proxy_next_upstream. Отказ
        # мёртвой реплики приходит как error, его и ловим.
        fastcgi_next_upstream error timeout invalid_header http_500 http_503;
        fastcgi_connect_timeout 2s;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    location ~ /(?:\.env|\.git|\.ht) {
        deny all;
    }
}
