# Старый адрес статьи до переноса блога в базу (Stage 6). Должен стоять раньше
# /gazeta/{slug}, иначе "post-1" разобрался бы как slug и дал 404.
gazeta_post_1_legacy:
  path: /gazeta/post-1
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
  defaults:
    route: gazeta_post
    slug: marketpleys-ili-internet-magazin
    permanent: true
  methods: [GET, HEAD]

# Текста оферты нет: услуги оказываются по двустороннему договору, заглушку не публикуем
# (LEGAL_RULES.md, раздел 9). Адрес мог попасть в закладки -- временно ведёт на услуги,
# пока не появится оферта сервиса.
offer:
  path: /offer
  controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
  defaults:
    route: app_services_index
    permanent: false
  methods: [GET, HEAD]

