twig:
  default_path: '%kernel.project_dir%/templates'
  globals:
    vf_site_url: '%vf.site_url%'
    # Команда: одни данные для главной и «О компании». photo -- путь в /assets/people/ (пусто -- инициалы).
    vf_team:
      title: 'Кто будет вашим финдиром'
      subtitle: 'За каждым клиентом закреплён один финансовый директор. Методологию и качество контролирует управляющий партнёр.'
      people:
        - { name: 'Павел Новиков', role: 'Управляющий партнёр', experience: '28 лет в бизнесе', photo: '/assets/people/pavel-novikov-portrait.png' }
        - { name: 'Наталья Новикова', role: 'Налоговый консультант', experience: '25 лет бухгалтер', photo: '' }
        - { name: 'Павел Иванов', role: 'Финансовый директор', experience: '8 лет', photo: '' }
        - { name: 'Анна Смирнова', role: 'Финансовый аналитик', experience: '3 года', photo: '' }
    # Факты о компании: одни данные для главной и «О компании». icon задан -- иконка и value заголовком.
    vf_company_facts:
      title: 'Нам доверяют'
      facts:
        - { value: 'с 2015', text: 'года работаем на рынке' }
        - { value: '230+', text: 'компаний прошли через нашу компанию' }
        - { value: 'до 8 числа', text: 'закрытие месяца' }
