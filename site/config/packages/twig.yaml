twig:
  default_path: '%kernel.project_dir%/templates'
  globals:
    vf_site_url: '%vf.site_url%'
    # Команда: одни данные для главной и «О компании». photo -- путь в /assets/people/ (пусто -- инициалы).
    vf_team:
      title: 'Кто будет с вами работать'
      subtitle: 'За каждым клиентом закреплён один финансовый директор. Методологию и качество контролирует управляющий партнёр.'
      people:
        - { name: 'Павел Новиков', role: 'Управляющий партнёр', experience: '28 лет в бизнесе', photo: '/assets/people/pavel-novikov-portrait.png', photo_webp: '/assets/people/pavel-novikov-portrait' }
        - { name: 'Наталья Новикова', role: 'Налоговый консультант', experience: '25 лет бухгалтер', photo: '/assets/people/nataliy-novikova-portrait.png', photo_webp: '/assets/people/nataliy-novikova-portrait' }
        - { name: 'Никита Ларионов', role: 'Финансовый директор', experience: '5 лет', photo: '/assets/people/nikita-larionov-portrait.png', photo_webp: '/assets/people/nikita-larionov-portrait' }
        - { name: 'Павел Аверьянов', role: 'Финансовый аналитик', experience: '3 года', photo: '/assets/people/pavel-averynov-portrait.png', photo_webp: '/assets/people/pavel-averynov-portrait' }
    # Факты для первого экрана, полосы доверия услуг и окна записи на разбор.
    # Пробелы в числах и датах неразрывные (U+00A0).
    vf_trust_facts:
      overview:
        - { value: 'С 2015 года', text: 'в финансах малого и среднего бизнеса: от бухгалтерии до финансового директора', short_value: 'С 2015', short_text: 'в финансах бизнеса' }
        - value: &vf_client_count '230+'
          value_suffix: 'компаний'
          text: &vf_client_text 'доверили нам учёт и финансы'
          note: &vf_client_note 'по данным на 1 октября 2026'
          short_value: *vf_client_count
          short_text: 'компаний'
      hero:
        - { value: *vf_client_count, text: *vf_client_text, note: *vf_client_note }
        - { value: '11 лет', text: 'в финансах' }
        # Показать только после добавления подтверждённого source.
        - { value: '23,5%', text: 'прибыли в среднем теряют компании', requires_source: true }
    # Полоса доверия главной: три карточки (docs/plan/Stage_Hero_Variant_A.md). Неразрывные пробелы -- U+00A0.
    vf_trust_cards:
      industries:
        title: 'С кем работаем'
        items: ['Торговля', 'Услуги', 'Маркетплейсы', 'Реклама', 'IT', 'Производство', 'Транспорт', 'Медицина', 'Строительство']
      ai:
        badge: 'AI'
        # Префикс заголовка только для скринридера: «AI‑решения для финансового управления».
        title_sr_prefix: 'AI‑'
        title: 'Решения для финансового управления'
        text: 'Быстрее собираем данные, находим отклонения'
      team:
        title: 'Ваша команда'
        text: 'Финдир, налоговый консультант и аналитики'
        link_label: 'Кто будет с вами работать →'
    # Факты о компании: одни данные для главной и «О компании». icon задан -- иконка и value заголовком.
    vf_company_facts:
      title: 'Нам доверяют'
      facts:
        - { value: 'с 2015', text: 'года работаем на рынке' }
        - { value: '230+', text: 'компаний прошли через нашу компанию' }
        - { value: 'до 8 числа', text: 'закрытие месяца' }
    # Вопросы страницы «Разработка финансовой модели»: блок «Вопросы и ответы» и разметка FAQPage. Без цен и сроков.
    vf_finmodel_faq:
        - { question: 'Чем финансовая модель отличается от бюджета?', answer: 'Бюджет — план на период. Модель связывает драйверы бизнеса с прибылью, деньгами и балансом и позволяет считать сценарии: что будет, если изменится цена, спрос или условия оплаты.' }
        - { question: 'Сколько времени занимает разработка?', answer: 'Зависит от сложности бизнеса и того, насколько готовы данные учёта. Срок называем после первой встречи.' }
        - { question: 'Что нужно от нас?', answer: 'Встреча на старте, выгрузки из учёта и банка и ответы на вопросы о планах. Промежуточные версии модели согласуем с вами.' }
        - { question: 'Можно ли сделать модель для нового проекта или инвестора?', answer: 'Да. Для нового проекта модель строится от допущений и рыночных данных, для инвестора — с понятной логикой и сценариями.' }
        - { question: 'Кто будет обновлять модель?', answer: 'Можно обновлять самостоятельно или подключить нас: сверяем план с фактом и корректируем модель.' }
        - { question: 'Сколько это стоит?', answer: 'Стоимость зависит от сложности бизнеса и задачи модели. Называем цену после первой встречи.' }
