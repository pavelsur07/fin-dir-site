parameters:
  vf.docs_url: 'https://docs.vashfindir.ru'
  vf.site_url: 'https://vashfindir.ru'
  # Форма вопроса в панели и под статьёй: общий текст. Свой заголовок задаётся у публикации (Post::formTitle).
  vf.article_form.title: 'Вопрос по вашей ситуации?'
  vf.article_form.text: 'Консультант ответит в Telegram или перезвонит в течение часа.'
  # Обложки статей. URL совпадает с PostCover::URL_PREFIX; в production -- том site_uploads.
  vf.post_cover.dir: '%kernel.project_dir%/public/uploads/posts'
  # Пусто -- уведомления о заявках выключены, заявки всё равно сохраняются.
  env(LEAD_RELAY_URL): ''
  env(LEAD_RELAY_TOKEN): ''
  env(DOCS_MCP_ENABLED): '0'
  env(DOCS_MCP_ACTOR): ''
  env(DOCS_MCP_PROFILE): 'published-reader'
  env(DOCS_MCP_HTTP_ENABLED): '0'
  env(DOCS_MCP_OAUTH_ISSUER): ''
  env(DOCS_MCP_HTTP_ORIGINS): ''
  env(DOCS_MCP_JWKS_HOSTS): ''
  env(DOCS_MCP_OAUTH_CA_FILE): ''

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: '../src/'
    exclude:
      - '../src/Kernel.php'
      - '../src/Documentation/Mcp/DocMcpAccess.php'
      - '../src/Documentation/Mcp/DocMcpToolHandler.php'

  documentation_mcp.http_logger:
    class: Symfony\Component\HttpKernel\Log\Logger
    arguments:
      $minLevel: info
      $output: 'php://stderr'

  documentation_mcp.lock_factory:
    class: Symfony\Component\Lock\LockFactory
    arguments: ['@documentation_mcp.lock_store']

  documentation_mcp.lock_store:
    class: Symfony\Component\Lock\Store\DoctrineDbalPostgreSqlStore
    arguments: ['@doctrine.dbal.default_connection']

  App\Documentation\ValueObject\DocUrl:
    arguments:
      $base: '%vf.docs_url%'
      $adminBase: '%vf.site_url%'

  App\Controller\:
    resource: '../src/Controller/'
    tags: ['controller.service_arguments']

  # URL из DATABASE_URL хендлер сам переводит в PDO DSN; подключается лениво,
  # только когда /admin реально открывает сессию.
  Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
    arguments:
      - '%env(DATABASE_URL)%'

  # HTTP-клиент Битрикс24: без логгера (в URL вебхука токен) и без доступа во внутреннюю сеть.
  bitrix24.http_client.inner:
    class: Symfony\Contracts\HttpClient\HttpClientInterface
    factory: ['Symfony\Component\HttpClient\HttpClient', 'create']
  bitrix24.http_client:
    class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
    arguments: ['@bitrix24.http_client.inner']

when@test:
  parameters:
    # Тесты не пишут в public: файлы обложек уходят во временный каталог var.
    vf.post_cover.dir: '%kernel.project_dir%/var/test/uploads/posts'
