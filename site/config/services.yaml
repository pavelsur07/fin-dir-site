parameters:
  vf.site_url: 'https://vashfindir.ru'
  # Форма вопроса в панели и под статьёй: общий текст. Свой заголовок задаётся у публикации (Post::formTitle).
  vf.article_form.title: 'Вопрос по вашей ситуации?'
  vf.article_form.text: 'Консультант ответит в Telegram или перезвонит в течение часа.'
  # Обложки статей. URL совпадает с PostCover::URL_PREFIX; в production -- том site_uploads.
  vf.post_cover.dir: '%kernel.project_dir%/public/uploads/posts'
  # Пусто -- уведомления о заявках выключены, заявки всё равно сохраняются.
  env(LEAD_RELAY_URL): ''
  env(LEAD_RELAY_TOKEN): ''

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: '../src/'
    exclude:
      - '../src/Kernel.php'

  App\Controller\:
    resource: '../src/Controller/'
    tags: ['controller.service_arguments']

  # URL из DATABASE_URL хендлер сам переводит в PDO DSN; подключается лениво,
  # только когда /admin реально открывает сессию.
  Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
    arguments:
      - '%env(DATABASE_URL)%'

when@test:
  parameters:
    # Тесты не пишут в public: файлы обложек уходят во временный каталог var.
    vf.post_cover.dir: '%kernel.project_dir%/var/test/uploads/posts'
